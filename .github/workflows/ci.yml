name: CI

# Kept small to save Actions minutes. The "Protect main" ruleset requires `verify` to pass on a PR
# that is up to date with main, so main itself doesn't re-run it; start a full run by hand from the
# Actions tab (workflow_dispatch) when needed. Draft PRs skip CI until they are marked ready.
# Docs-only changes still run: a required check that never runs would block the PR.
#
# The checks run as parallel jobs; `verify` (the required check) only gathers their results.
# Together they cover `npm run verify` and `npm run test:e2e`:
#   quality  lint (ESLint + Prettier), typecheck
#   api      shared tests, the real migration CLI (db:reset:test), API tests
#   web      web tests
#   deploy   deploy, backup/restore and release-packing tests (test:deploy, PowerShell 7)
#   e2e      build, check:bundle, Playwright in two shards (one database and app per shard)
# Each job builds @materialmule/shared once, before anything that imports it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Only the browser-cache job runs on main (PR runs can read caches saved on main, not each other's).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Production runs on a Windows PC (D25), so every job does too. Each check job repeats the same
# condition as `verify`: manual runs and ready (non-draft) PRs.
env:
  CI: 'true'
  REQUIRE_DATABASE_TESTS: '1'
  TEST_DATABASE_URL: postgres://postgres:root@127.0.0.1:5432/materialmule_test

jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run build:shared
      - run: npm run typecheck --workspaces --if-present

  api:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          database: 'true'
      - run: npm run build:shared
      - run: npm run test -w @materialmule/shared
      # Exercises the real migration CLI; tests also build their own isolated schemas.
      - run: npm run db:reset:test
      - run: npm run test -w @materialmule/api

  web:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build:shared
      - run: npm run test -w @materialmule/web

  # The backup/restore drill needs the test database (and CREATEDB, which CI's postgres user has).
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          database: 'true'
      - run: npm run test:deploy

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    name: e2e (shard ${{ matrix.shard }}/2)
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      # Let the other shard finish so its report is kept; `verify` still fails.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          database: 'true'

      - name: Playwright version
        id: playwright
        shell: pwsh
        run: |
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          "version=$($lock.packages['node_modules/@playwright/test'].version)" >> $env:GITHUB_OUTPUT

      # The browser download was the slowest step (~2.5 min); it is cached per Playwright version.
      - uses: actions/cache/restore@v4
        id: browsers
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # One production build per shard: checked for secrets, then served by the E2E API as is.
      - run: npm run build
      - run: npm run check:bundle
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # E2E_PREBUILT skips Playwright's own rebuild and refuses missing or stale builds.
      # The app's web server still resets and seeds this runner's test database first.
      - name: E2E (shard ${{ matrix.shard }}/2)
        env:
          E2E_PREBUILT: '1'
        run: npx playwright test --shard=${{ matrix.shard }}/2

      # MM-T18 AC2: the receiving critical path three more times in a row, with no retries.
      # Manual runs only, to save minutes; the E2E run above already includes it once. The
      # repeated set is sharded too, so the two shards together run it exactly three times.
      # Bash, because PowerShell's npx wrapper reads a bare @critical as splatting.
      - name: Critical path x3 (@critical, shard ${{ matrix.shard }}/2)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          E2E_PREBUILT: '1'
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-critical
        run: npx playwright test --grep @critical --repeat-each=3 --shard=${{ matrix.shard }}/2

      # The HTML reports embed the failure traces; test-results/ holds them as raw files too.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-report-critical/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The required check. It runs whenever the check jobs were meant to run, even after one failed
  # or was cancelled, and passes only if every one of them succeeded: a skipped or missing job
  # fails it. On drafts and main pushes it is skipped like the jobs it gathers, as before.
  verify:
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    needs: [quality, api, web, deploy, e2e]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: All checks succeeded
        shell: pwsh
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          $needs = $env:NEEDS | ConvertFrom-Json -AsHashtable
          $required = 'quality', 'api', 'web', 'deploy', 'e2e'
          $failed = @()
          foreach ($job in $required) {
            $result = if ($needs.ContainsKey($job)) { $needs[$job].result } else { 'missing' }
            "${job}: $result"
            if ($result -ne 'success') { $failed += $job }
          }
          if ($failed.Count -gt 0) { throw "Not all checks succeeded: $($failed -join ', ')" }

  # Saves the Playwright browser to the cache from main, where every PR run can restore it.
  # Runs about a minute only when the Playwright version changes; otherwise it ends after the lookup.
  browser-cache:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package-lock.json
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Playwright version
        id: playwright
        shell: pwsh
        run: |
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          "version=$($lock.packages['node_modules/@playwright/test'].version)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: browsers
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          lookup-only: true

      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx --yes playwright@${{ steps.playwright.outputs.version }} install chromium

      - if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
