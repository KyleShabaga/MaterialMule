<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strata UI late React test</title>
<link rel="stylesheet" href="strata-ui.css">
<!-- Like the canvas: the bundle runs first, React arrives later by script injection. -->
<script src="strata-ui.js"></script>
</head>
<body>
<div id="root"></div>
<script>
function load(src) { return new Promise(function (ok) { var s = document.createElement('script'); s.src = src; s.onload = ok; document.head.appendChild(s); }); }
window.__before = typeof window.Strata;
Promise.all([load('react.production.min.js'), load('react-dom.production.min.js')]).then(function () {
  window.__after = typeof window.Strata;
  var h = React.createElement, S = window.Strata;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(S.SidebarProvider, null, h(S.Sidebar, { collapsible: 'icon' }, h(S.SidebarContent, null, h(S.SidebarMenu, null, h(S.SidebarMenuItem, null, h(S.SidebarMenuButton, { isActive: true }, h(S.Icon, { name: 'house' }), h('span', null, 'Today'))))))));
});
</script>
</body>
</html>
