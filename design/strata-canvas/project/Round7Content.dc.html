<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 7 content (concrete lab)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="strata-ui/strata-ui.css">
<script src="strata-ui/strata-ui.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.sc-host:has(> .r7-router){flex:1 1 0%;min-height:0;height:100%;display:flex;flex-direction:column}
</style>
</helmet>
<!-- Round 7, concrete lab: routes the shell's r7-<variant> to the screen component. -->
<x-import component-from-global-scope="Strata.Theme" dark="{{dark}}">
<div class="r7-router bg-background text-foreground flex min-h-0 flex-1 flex-col" style="height: 100%;">
<sc-if value="{{isR7Overview}}" hint-placeholder-val="{{ false }}">
<div class="flex min-h-0 flex-1 flex-col"><dc-import name="R7Overview" variant="{{variant}}" station="{{station}}" dark="{{dark}}" hint-size="100%,744px"></dc-import></div>
</sc-if>
<sc-if value="{{isR7Breaks}}" hint-placeholder-val="{{ true }}">
<div class="flex min-h-0 flex-1 flex-col"><dc-import name="R7Breaks" variant="{{variant}}" station="{{station}}" dark="{{dark}}" hint-size="100%,744px"></dc-import></div>
</sc-if>
<sc-if value="{{isR7Testing}}" hint-placeholder-val="{{ false }}">
<div class="flex min-h-0 flex-1 flex-col"><dc-import name="R7Testing" variant="{{variant}}" station="{{station}}" dark="{{dark}}" hint-size="100%,744px"></dc-import></div>
</sc-if>
<sc-if value="{{isR7Receiving}}" hint-placeholder-val="{{ false }}">
<div class="flex min-h-0 flex-1 flex-col"><dc-import name="R7Receiving" variant="{{variant}}" station="{{station}}" dark="{{dark}}" hint-size="100%,744px"></dc-import></div>
</sc-if>
<sc-if value="{{isR7Specimens}}" hint-placeholder-val="{{ false }}">
<div class="flex min-h-0 flex-1 flex-col"><dc-import name="R7Specimens" variant="{{variant}}" station="{{station}}" dark="{{dark}}" hint-size="100%,744px"></dc-import></div>
</sc-if>
<sc-if value="{{isR7Holds}}" hint-placeholder-val="{{ false }}">
<div class="flex min-h-0 flex-1 flex-col"><dc-import name="R7Holds" variant="{{variant}}" station="{{station}}" dark="{{dark}}" hint-size="100%,744px"></dc-import></div>
</sc-if>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"select","options":["overview","overview-clear","overview-loading","overview-failed","a","a-selected","a-reschedule","overdue","hold","exceptions","empty","nomachine","loading","station","testing","testing-reason","testing-selection","testing-station","receiving","receiving-set","receiving-pickup","receiving-empty","receiving-loading","specimens","set-due","set-awaiting","set-hold","set-notfound","set-loading","holds","holds-selected","holds-dispose","holds-tech","holds-failed","holds-empty","holds-loading"],"default":"a"},"station":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":1024,"height":744}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant || 'a';
    var route = {"overview":"R7Overview","overview-clear":"R7Overview","overview-loading":"R7Overview","overview-failed":"R7Overview","a":"R7Breaks","a-selected":"R7Breaks","a-reschedule":"R7Breaks","overdue":"R7Breaks","hold":"R7Breaks","exceptions":"R7Breaks","empty":"R7Breaks","nomachine":"R7Breaks","loading":"R7Breaks","station":"R7Breaks","testing":"R7Testing","testing-reason":"R7Testing","testing-selection":"R7Testing","testing-station":"R7Testing","receiving":"R7Receiving","receiving-set":"R7Receiving","receiving-pickup":"R7Receiving","receiving-empty":"R7Receiving","receiving-loading":"R7Receiving","specimens":"R7Specimens","set-due":"R7Specimens","set-awaiting":"R7Specimens","set-hold":"R7Specimens","set-notfound":"R7Specimens","set-loading":"R7Specimens","holds":"R7Holds","holds-selected":"R7Holds","holds-dispose":"R7Holds","holds-tech":"R7Holds","holds-failed":"R7Holds","holds-empty":"R7Holds","holds-loading":"R7Holds"};
    var c = route[v] || 'R7Breaks';
    return { variant: v, station: !!this.props.station, dark: !!this.props.dark, isR7Overview: c === 'R7Overview', isR7Breaks: c === 'R7Breaks', isR7Testing: c === 'R7Testing', isR7Receiving: c === 'R7Receiving', isR7Specimens: c === 'R7Specimens', isR7Holds: c === 'R7Holds' };
  }
}
</script>
</body>
</html>
