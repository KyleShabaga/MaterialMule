<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 4 — projects</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="strata-ui/strata-ui.css">
<script src="strata-ui/strata-ui.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.sc-host:has(> .r4-root){flex:1 1 0%;min-height:0;height:100%}
</style>
</helmet>
<!-- Round 4 (projects) for the shell: variant "list-<v>" is the Projects list, anything else the project page. -->
<div class="r4-root flex min-h-0 flex-1 flex-col" style="height: 100%;">
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}"><dc-import name="R4List" variant="{{listVariant}}" hint-size="100%,744px"></dc-import></sc-if>
<sc-if value="{{isProject}}" hint-placeholder-val="{{ false }}"><dc-import name="R4Project" variant="{{projectVariant}}" station="{{station}}" hint-size="100%,744px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"select","options":["list-mine","list-all","list-waiting","list-empty","list-nomatch","list-loading","list-error","overview","overview-waiting","overview-noassign","loading","notfound","error","units","units-peek","programs","concrete","team","team-member","team-nominate","team-pending","team-admin","team-person","team-grant"],"default":"list-mine"},"station":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":1024,"height":744}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant || 'list-mine';
    var isList = v.indexOf('list-') === 0;
    return { isList: isList, isProject: !isList, listVariant: v.replace('list-', ''), projectVariant: v, station: !!this.props.station };
  }
}
</script>
</body>
</html>
