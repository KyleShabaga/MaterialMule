<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 8 content (concrete review and reports)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="strata-ui/strata-ui.css">
<script src="strata-ui/strata-ui.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
.sc-host:has(> .r8-root){flex:1 1 0%;min-height:0;height:100%}

</style>
</helmet>
<div class="r8-root flex min-h-0 flex-1 flex-col" style="height: 100%;">
<sc-if value="{{queue}}" hint-placeholder-val="{{ true }}"><div class="flex min-h-0 flex-1 flex-col"><dc-import name="R8QueueContent" variant="{{sub}}" station="{{station}}" hint-size="100%,744px"></dc-import></div></sc-if>
<sc-if value="{{report}}" hint-placeholder-val="{{ false }}"><div class="flex min-h-0 flex-1 flex-col"><dc-import name="R8ReportContent" variant="{{sub}}" station="{{station}}" hint-size="100%,744px"></dc-import></div></sc-if>
<sc-if value="{{strength}}" hint-placeholder-val="{{ false }}"><div class="flex min-h-0 flex-1 flex-col"><dc-import name="R8StrengthContent" variant="{{sub}}" station="{{station}}" hint-size="100%,744px"></dc-import></div></sc-if>
<sc-if value="{{project}}" hint-placeholder-val="{{ false }}"><div class="flex min-h-0 flex-1 flex-col"><dc-import name="R8ProjectContent" variant="{{sub}}" station="{{station}}" hint-size="100%,744px"></dc-import></div></sc-if>
<sc-if value="{{mix}}" hint-placeholder-val="{{ false }}"><div class="flex min-h-0 flex-1 flex-col"><dc-import name="R8MixContent" variant="{{sub}}" station="{{station}}" hint-size="100%,744px"></dc-import></div></sc-if>
<sc-if value="{{prop}}" hint-placeholder-val="{{ false }}"><div class="flex min-h-0 flex-1 flex-col"><dc-import name="R8PropContent" variant="{{sub}}" station="{{station}}" hint-size="100%,744px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"select","options":["queue-waiting","queue-returned","queue-reviewed","queue-exceptions","queue-empty","queue-loading","queue-error","report-review","report-ready","report-return","report-own","report-changed","report-unavailable","report-loading","report-error","report-review-drawer","report-issue","report-confirm","report-issued","report-issue-drawer","strength-review","strength-exclude","strength-notready","strength-review-drawer","project-reports","project-sets","project-mixes","project-mixes-empty","project-summary","project-settings","project-error","mix-pending","mix-approved","mix-unapproved","mix-readonly","prop-review","prop-stale","prop-applied","prop-none"],"default":"queue-waiting"},"station":{"editor":"boolean","default":false},"dark":{"editor":"boolean","default":false},"$preview":{"width":1024,"height":744}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant || 'queue-waiting';
    var i = v.indexOf('-'); var f = i < 0 ? v : v.slice(0, i);
    return { sub: i < 0 ? '' : v.slice(i + 1), station: !!this.props.station, queue: f === 'queue', report: f === 'report', strength: f === 'strength', project: f === 'project', mix: f === 'mix', prop: f === 'prop' };
  }
}
</script>
</body>
</html>
