<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar — variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1320px; height: 1040px; box-sizing: border-box; padding: 48px; background: #EFF0F3; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #1E1F24; display: flex; gap: 64px; align-items: flex-start;">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
<figcaption style="font-size: 14px; font-weight: 600;">Expanded · light</figcaption>
<div style="border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(30,31,36,.06), 0 4px 12px rgba(30,31,36,.08);"><dc-import name="SidebarNav" hint-size="256px,900px"></dc-import></div>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
<figcaption style="font-size: 14px; font-weight: 600;">Expanded · dark</figcaption>
<div style="border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(30,31,36,.06), 0 4px 12px rgba(30,31,36,.08);"><dc-import name="SidebarNav" dark="{{yes}}" hint-size="256px,900px"></dc-import></div>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
<figcaption style="font-size: 14px; font-weight: 600;">Account menu open</figcaption>
<div style="border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(30,31,36,.06), 0 4px 12px rgba(30,31,36,.08);"><dc-import name="SidebarNav" menu-open="{{yes}}" hint-size="256px,900px"></dc-import></div>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
<figcaption style="font-size: 14px; font-weight: 600;">Icons</figcaption>
<div style="border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(30,31,36,.06), 0 4px 12px rgba(30,31,36,.08);"><dc-import name="SidebarNav" collapsed="{{yes}}" hint-size="48px,900px"></dc-import></div>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px;">
<figcaption style="font-size: 14px; font-weight: 600;">Icons · dark</figcaption>
<div style="border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(30,31,36,.06), 0 4px 12px rgba(30,31,36,.08);"><dc-import name="SidebarNav" dark="{{yes}}" collapsed="{{yes}}" hint-size="48px,900px"></dc-import></div>
</figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1320,"height":1040}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
