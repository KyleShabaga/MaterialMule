<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&amp;family=Atkinson+Hyperlegible+Next:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="{{theme}} position: relative; width: {{width}}; height: 900px; box-sizing: border-box; overflow: hidden; background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column;">

<!-- SidebarHeader: workspace switcher (Linear) + new + collapse -->
<div style="padding: 8px; display: flex; flex-direction: column; gap: 6px;">
<div style="display: flex; align-items: center; gap: 2px;">
<button type="button" aria-label="Material Mule, Receiving lab. Switch lab" style="flex: 1; min-width: 0; height: 36px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; color: inherit; font: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left;">
<span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 7px; background: var(--primary); color: var(--primary-foreground); display: flex; align-items: center; justify-content: center; flex: none;"><svg width="17" height="13" viewBox="150 230 960 760" aria-hidden="true"><g fill="currentColor"><path d="M352,595 C335,615 320,640 300,665 C285,680 275,700 262,720 C240,752 200,768 165,772 C180,755 185,735 200,710 C220,680 250,660 280,655 C300,640 315,600 340,575 Z"></path><path d="M340,580 C365,535 425,503 500,500 C580,497 640,520 700,505 C760,490 805,465 845,435 C885,405 912,390 938,390 L1000,405 C1025,430 1042,452 1047,472 C1060,510 1080,545 1087,577 C1092,605 1074,628 1050,628 C1030,628 1018,614 1014,600 C980,582 945,568 925,540 C902,578 878,612 862,632 L850,700 L745,690 C700,715 640,728 590,722 C550,716 522,702 505,690 L495,700 C470,745 420,745 395,735 C355,690 330,640 340,580 Z"></path><path d="M350,690 C360,730 380,745 395,765 C380,790 350,805 320,825 C290,850 272,880 268,920 C272,935 285,950 292,970 L232,970 L232,955 C238,945 230,930 240,915 C260,880 280,840 300,800 C320,780 340,760 350,690 Z"></path><path d="M715,700 L770,720 C760,770 740,800 725,840 C710,880 700,910 715,970 L655,970 C660,950 648,935 650,915 C665,870 690,820 705,780 C712,760 712,730 715,700 Z"></path><path d="M935,412 C928,360 945,300 995,255 C1002,300 992,360 975,405 Z"></path><path d="M978,402 C1000,340 1040,300 1075,270 C1082,320 1052,380 1008,412 Z"></path></g></svg></span>
<span style="{{hide}} flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 16px;"><span style="font-weight: 700; font-size: 14px;">Material Mule</span><span style="font-size: 12px; color: var(--muted-foreground);">Receiving lab</span></span>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
</button>
<button type="button" aria-label="New" title="New receipt, lab program or field report" style="{{hide}} width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--sidebar-foreground); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path></svg></button>
</div>

<!-- Search (Notion) -->
<button type="button" aria-label="Search or scan a label" style="{{hide}} height: 32px; padding: 0 6px 0 10px; border: 1px solid var(--sidebar-border); border-radius: 8px; background: var(--card); color: var(--muted-foreground); font: inherit; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg><span style="flex: 1;">Search or scan</span><kbd style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 11px; line-height: 18px; padding: 0 5px; border-radius: 5px; background: var(--muted); color: var(--muted-foreground);">Ctrl K</kbd></button>
<sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Search or scan a label" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--sidebar-foreground); display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></button></sc-if>
</div>

<!-- SidebarContent -->
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 8px; display: flex; flex-direction: column; gap: 12px;">

<!-- Personal (Linear Inbox / My issues) -->
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px;">
<li><a href="#" aria-current="page" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); font-weight: 600; text-decoration: none; white-space: nowrap;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Today</a></li>
<li><a href="#" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap; position: relative;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span style="flex: 1;">Inbox</span><span role="img" aria-label="Unread" style="width: 7px; height: 7px; border-radius: 50%; background: var(--primary); flex: none; position: relative; left: {{dotShift}};"></span></a></li>
<li><a href="#" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10.656V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.344"></path><path d="m9 11 3 3L22 4"></path></svg>My requests</a></li>
</ul>

<!-- Workspace group -->
<div style="display: flex; flex-direction: column; gap: 1px;">
<button type="button" aria-expanded="true" style="{{hide}} height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer;">Lab<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px;">
<li><a href="#" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>Projects</a></li>
<li><a href="#" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17V3"></path><path d="m6 11 6 6 6-6"></path><path d="M19 21H5"></path></svg>Receive</a></li>
<li><a href="#" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path><path d="M12 22V12"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><path d="m7.5 4.27 9 5.15"></path></svg>Inventory</a></li>

<li style="display: flex; align-items: center;"><a href="#" style="flex: 1; min-width: 0; height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg>Retention</a><button type="button" aria-label="Show Retention pages" aria-expanded="false" style="{{hide}} width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; flex: none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></li>
<li style="display: flex; align-items: center;"><a href="#" style="flex: 1; min-width: 0; height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14a9 3 0 0 0 18 0V5"></path></svg>Concrete</a><button type="button" aria-label="Hide Concrete pages" aria-expanded="true" style="{{hide}} width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted-foreground); display: flex; align-items: center; justify-content: center; flex: none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></li>
<li style="{{hide}}"><ul style="list-style: none; margin: 1px 0 0 15px; padding: 0 0 0 10px; border-left: 1px solid var(--sidebar-border); display: flex; flex-direction: column; gap: 1px;">
<li><a href="#" style="height: 28px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; color: inherit; text-decoration: none; font-size: 13px;">Breaks</a></li>
<li><a href="#" style="height: 28px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; color: inherit; text-decoration: none; font-size: 13px;">Receiving</a></li>
<li><a href="#" style="height: 28px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; color: inherit; text-decoration: none; font-size: 13px;">Specimens</a></li>
<li><a href="#" style="height: 28px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; color: inherit; text-decoration: none; font-size: 13px;">Holds</a></li>
<li><a href="#" style="height: 28px; padding: 0 8px; border-radius: 6px; display: flex; align-items: center; color: inherit; text-decoration: none; font-size: 13px;">Review</a></li>
</ul></li>
</ul>
</div>

<!-- Pinned (Notion favorites) -->
<div style="{{hide}} display: flex; flex-direction: column; gap: 1px;">
<button type="button" aria-expanded="true" style="height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer;">Pinned<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px;">
<li><a href="#" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap; overflow: hidden;"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: var(--storage-bg); color: var(--storage-mark); display: flex; align-items: center; justify-content: center; flex: none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg></span><span style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 13px;">DEMO-2601</span><span style="color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis;">Riverbank</span></a></li>
<li><a href="#" style="height: 32px; padding: 0 8px; border-radius: 8px; display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; white-space: nowrap; overflow: hidden;"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 4px; background: var(--due-bg); color: var(--due-mark); display: flex; align-items: center; justify-content: center; flex: none;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5v14a9 3 0 0 0 18 0V5"></path></svg></span><span style="font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-size: 13px;">DEMO-2616</span><span style="color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis;">Riverside apts</span></a></li>

</ul>
</div>

<!-- Recent (Notion recents), folded -->
<button type="button" aria-expanded="false" style="{{hide}} height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--muted-foreground); font: inherit; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer;">Recent<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>

<!-- SidebarFooter -->
<div style="padding: 8px; display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--sidebar-border);">
<button type="button" aria-label="Alex Tester, Technician. Account menu" aria-haspopup="menu" aria-expanded="{{menuOpen}}" style="height: 44px; padding: 0 4px; border: 0; border-radius: 8px; background: {{userBg}}; color: inherit; font: inherit; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; white-space: nowrap;">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-foreground); display: flex; align-items: center; justify-content: center; font-family: 'Atkinson Hyperlegible Mono', ui-monospace, monospace; font-weight: 700; font-size: 12px; flex: none;">AT</span>
<span style="{{hide}} flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 16px;"><span style="font-weight: 600;">Alex Tester</span><span style="font-size: 12px; color: var(--muted-foreground);">Technician</span></span>
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
</button>
</div>

0 0 1 2-2h4"></path></svg><span style="flex: 1;">Sign out</span></button></div></sc-if>
