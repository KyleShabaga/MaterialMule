<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Material Mule</title>
    <!-- MM-V2-C11 spike: Home Screen install (manifest for Android/Chrome, Apple tags for iOS). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0369a1" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Material Mule" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // MISC-09: apply a stored light/dark choice before first paint (src/theme/theme.ts).
      try {
        var theme = localStorage.getItem('materialmule:theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
