<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: retention</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8340A}a:hover{color:#14140F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4EF; color: #14140F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">

  <header style="padding: 10px 16px 12px; border-bottom: 2px solid #14140F; background: #E8E9E2; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="PhoneMore.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: #14140F">Back</a>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">AS OF 10 NOV 2026</span>
    </div>
    <div role="group" aria-label="Show" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid #14140F; border-radius: 4px; overflow: hidden">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 48px; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 0; border-right: 1px solid #14140F; font-family: inherit; background: {{t.bg}}; color: {{t.fg}}">
          <span style="font-size: 16px; font-weight: 800; line-height: 1.1">{{t.n}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">{{t.label}}</span>
        </button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1 1 0; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Retention</h1>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #CFCFC4; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
          <a href="PhoneUnit.dc.html" style="color: #14140F"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px">{{r.id}}</span><span style="display: block; font-size: 13px; color: #45463E">{{r.project}} · {{r.loc}}</span></a>
          <span style="text-align: right"><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #45463E">ENDS</span><span style="display: block; font-weight: 700; white-space: nowrap">{{r.ends}}</span></span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="min-height: 44px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; color: #14140F">Extend</button>
          <button type="button" aria-pressed="{{r.on}}" onClick="{{r.toggle}}" style="min-height: 44px; border: 2px solid #14140F; border-radius: 4px; font-family: inherit; font-weight: 700; font-size: 14px; background: {{r.bg}}; color: {{r.fg}}">{{r.btn}}</button>
        </div>
      </div>
    </sc-for>

    <a href="PhoneScan.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 60px; border: 2px solid #14140F; border-radius: 6px; background: #FF5A1F; font-weight: 800; font-size: 18px; color: #14140F; text-decoration: none">Scan out {{listCount}} for disposal</a>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid #14140F; background: #FFFFFF">
    <a href="PhoneToday.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Today</a>
    <a href="PhoneFind.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none; border-left: 1px solid #CFCFC4">Find</a>
    <a href="PhoneScan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 800; font-size: 14px; color: #14140F; background: #FF5A1F; text-decoration: none; border-left: 2px solid #14140F; border-right: 2px solid #14140F">Scan</a>
    <a href="PhoneReceive.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Receive</a>
    <a href="PhoneMore.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #F4F4EF; background: #14140F; text-decoration: none">More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'OVERDUE', list: { 'BKT-2025-000310': true, 'CT-2025-000199': true } };
  }
  renderVals() {
    const st = this.state;
    const data = {
      'OVERDUE': [['BKT-2025-000310', 'DEMO-2613', 'Bay D · Shelf 1', '28 Oct 2026'], ['CT-2025-000199', 'DEMO-2613', 'Bay D · Floor', '28 Oct 2026']],
      'THIS MONTH': [['BKT-2026-000061', 'DEMO-2611', 'Bay A · Shelf 4', '14 Nov 2026'], ['ST-2026-000012', 'DEMO-2611', 'Tube rack · Slot 3', '14 Nov 2026'], ['BKT-2026-000064', 'DEMO-2611', 'Bay A · Shelf 4', '21 Nov 2026']],
      'NEXT 90 DAYS': [['CRE-2025-000017', 'DEMO-2610', 'Core racks · Row 2', '09 Jan 2027'], ['BKT-2026-000090', 'DEMO-2612', 'Bay B · Shelf 3', '02 Feb 2027']]
    };
    const rows = data[st.tab].map(([id, project, loc, ends]) => ({ id, project, loc, ends, on: !!st.list[id], btn: st.list[id] ? 'On the list' : 'Add to disposal', bg: st.list[id] ? '#14140F' : '#FFFFFF', fg: st.list[id] ? '#F4F4EF' : '#14140F', toggle: () => this.setState({ list: { ...st.list, [id]: !st.list[id] } }) }));
    return {
      rows, listCount: Object.values(st.list).filter(Boolean).length,
      tabs: Object.keys(data).map((label) => ({ label, n: data[label].length, on: st.tab === label, bg: st.tab === label ? '#14140F' : '#FFFFFF', fg: st.tab === label ? '#F4F4EF' : '#14140F', pick: () => this.setState({ tab: label }) }))
    };
  }
}
</script>
</body>
</html>
