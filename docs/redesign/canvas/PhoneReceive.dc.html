<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: add a unit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8340A}a:hover{color:#14140F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4EF; color: #14140F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 2px solid #14140F; background: #E8E9E2">
    <a href="PhoneToday.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: #14140F">Save draft</a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 3px; background: #FBEBC2; color: #7A4E00">DRAFT · DEMO-2601</span>
  </header>

  <div style="flex: 1 1 0; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Add a unit</h1>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #45463E">UNIT 3 OF THIS DELIVERY</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div id="holder" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">WHAT IS IT IN?</div>
      <div role="group" aria-labelledby="holder" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 64px; padding: 8px 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; border: 2px solid #14140F; border-radius: 6px; font-family: inherit; text-align: left; background: {{t.bg}}; color: {{t.fg}}">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; line-height: 1">{{t.prefix}}</span>
            <span style="font-size: 14px; font-weight: 600">{{t.label}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="hole" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">TEST HOLE</label>
      <input id="hole" type="text" value="TH26-02" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #14140F">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="samples" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">SAMPLES (SUMMARY)</label>
      <input id="samples" type="text" value="ST1" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #14140F">
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="from" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">DEPTH FROM (M)</label>
        <input id="from" type="text" inputmode="decimal" value="3.0" style="height: 48px; box-sizing: border-box; min-width: 0; padding: 0 14px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #14140F">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="to" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">DEPTH TO (M)</label>
        <input id="to" type="text" inputmode="decimal" value="3.6" style="height: 48px; box-sizing: border-box; min-width: 0; padding: 0 14px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #14140F">
      </div>
    </div>

    <button type="button" style="min-height: 52px; border: 2px dashed #14140F; border-radius: 6px; background: transparent; font-family: inherit; font-weight: 700; font-size: 15px; color: #14140F">Scan the shelf it goes on</button>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; color: #45463E">No ID yet. {{idNote}}</div>
      <button type="button" style="min-height: 60px; border: 2px solid #14140F; border-radius: 6px; background: #FF5A1F; font-family: inherit; font-weight: 800; font-size: 18px; color: #14140F">Add to delivery</button>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid #14140F; background: #FFFFFF">
    <a href="PhoneToday.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Today</a>
    <a href="PhoneFind.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none; border-left: 1px solid #CFCFC4">Find</a>
    <a href="PhoneScan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 800; font-size: 14px; color: #14140F; background: #FF5A1F; text-decoration: none; border-left: 2px solid #14140F; border-right: 2px solid #14140F">Scan</a>
    <a href="PhoneReceive.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #F4F4EF; background: #14140F; text-decoration: none">Receive</a>
    <a href="PhoneMore.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none; border-left: 1px solid #CFCFC4">More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'ST' };
  }
  renderVals() {
    const cur = this.state.type;
    const types = [['BKT','Bucket'],['ST','Shelby tube'],['CRE','Core box'],['CT','Other container']].map(([prefix, label]) => ({
      prefix, label, on: cur === prefix, bg: cur === prefix ? '#14140F' : '#FFFFFF', fg: cur === prefix ? '#F4F4EF' : '#14140F',
      pick: () => this.setState({ type: prefix })
    }));
    return { types, idNote: 'A ' + cur + '-2026 number is issued when the delivery is confirmed.' };
  }
}
</script>
</body>
</html>
