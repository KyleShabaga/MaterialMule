<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: field report, tests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8340A}a:hover{color:#14140F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4EF; color: #14140F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">

  <header style="padding: 8px 16px 12px; border-bottom: 2px solid #14140F; background: #E8E9E2; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <a href="PhoneConcrete.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: #14140F">Save and close</a>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 3px; background: #FBEBC2; color: #7A4E00">DRAFT · SAVED ON DEVICE</span>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">Field tests</h1>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #45463E">DEMO-2616 · TICKET 004452</span>
    </div>
    <ol aria-label="Steps" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); list-style: none; margin: 0; padding: 0; border: 2px solid #14140F; border-radius: 4px; overflow: hidden; font-weight: 700; font-size: 13px">
      <li style="display: flex"><a href="PhoneFieldLoad.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; background: #FFFFFF; color: #14140F; text-decoration: none; border-right: 1px solid #14140F">1 Load</a></li>
      <li aria-current="step" style="display: flex"><a href="PhoneFieldTests.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; background: #14140F; color: #F4F4EF; text-decoration: none; border-right: 1px solid #14140F">2 Tests</a></li>
      <li style="display: flex"><a href="PhoneFieldSpecimens.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; background: #FFFFFF; color: #14140F; text-decoration: none">3 Specimens</a></li>
    </ol>
  </header>

  <div style="flex: 1 1 0; min-height: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

    <sc-for list="{{tests}}" as="t" hint-placeholder-count="2">
      <section style="background: #FFFFFF; border: 2px solid #14140F; border-radius: 6px; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; background: #E8E9E2; border-bottom: 2px solid #14140F">
          <h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.name}}</h2>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">SPEC {{t.spec}}</span>
        </div>
        <sc-for list="{{t.rows}}" as="r" hint-placeholder-count="2">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 92px 72px; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #CFCFC4">
            <div style="min-width: 0">
              <div style="font-weight: 600; font-size: 14px">{{r.ctx}}</div>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 3px; background: {{r.bg}}; color: {{r.fg}}">{{r.res}}</span>
            </div>
            <input type="text" inputmode="decimal" aria-label="{{r.aVal}}" value="{{r.val}}" style="height: 48px; box-sizing: border-box; min-width: 0; padding: 0 8px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; color: #14140F; text-align: right">
            <input type="text" aria-label="{{r.aTime}}" value="{{r.time}}" style="height: 48px; box-sizing: border-box; min-width: 0; padding: 0 6px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: #14140F; text-align: center">
          </div>
        </sc-for>
        <div style="display: flex; gap: 8px; padding: 8px 12px">
          <button type="button" style="flex: 1 1 0; min-height: 44px; border: 2px dashed #14140F; border-radius: 4px; background: transparent; font-family: inherit; font-weight: 700; font-size: 13px; color: #14140F">Add a retest</button>
          <button type="button" style="flex: 1 1 0; min-height: 44px; border: 2px dashed #14140F; border-radius: 4px; background: transparent; font-family: inherit; font-weight: 700; font-size: 13px; color: #14140F">{{t.other}}</button>
        </div>
      </section>
    </sc-for>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="temp" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">CONCRETE TEMP, °C</label>
        <input id="temp" type="text" inputmode="decimal" value="18.5" style="height: 48px; box-sizing: border-box; min-width: 0; padding: 0 10px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; color: #14140F">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="meter" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">AIR METER</label>
        <select id="meter" style="height: 48px; min-width: 0; padding: 0 10px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: #14140F"><option>AM-02</option><option>AM-01</option></select>
      </div>
    </div>
    <div style="font-size: 13px; color: #45463E">A retest is kept beside the first reading. It never replaces it.</div>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; padding: 12px 16px; border-top: 2px solid #14140F; background: #FFFFFF">
    <a href="PhoneFieldLoad.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border: 2px solid #14140F; border-radius: 6px; background: #FFFFFF; font-weight: 700; font-size: 16px; color: #14140F; text-decoration: none">Back</a>
    <a href="PhoneFieldSpecimens.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border: 2px solid #14140F; border-radius: 6px; background: #FF5A1F; font-weight: 800; font-size: 18px; color: #14140F; text-decoration: none">Next: specimens</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = ['#DDEFE8','#0B5D4B'], warn = ['#FBEBC2','#7A4E00'];
    const row = (test, ctx, val, time, res, c) => ({ ctx, val, time, res, bg: c[0], fg: c[1], aVal: test + ', ' + ctx + ', reading', aTime: test + ', ' + ctx + ', time' });
    return {
      tests: [
        { name: 'Slump, mm', spec: '80 ± 30', other: 'After superplasticizer', rows: [row('Slump', 'First reading', '95', '10:50', 'IN SPEC', ok)] },
        { name: 'Air, %', spec: '5.0–8.0', other: 'After water added', rows: [row('Air', 'First reading', '8.4', '10:52', 'ABOVE SPEC', warn), row('Air', 'Retest', '7.6', '11:01', 'IN SPEC', ok)] }
      ]
    };
  }
}
</script>
</body>
</html>
