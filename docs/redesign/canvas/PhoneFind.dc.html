<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: find</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8340A}a:hover{color:#14140F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4EF; color: #14140F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">

  <header style="padding: 12px 16px; border-bottom: 2px solid #14140F; background: #E8E9E2; display: flex; flex-direction: column; gap: 10px">
    <div role="search" style="position: relative">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14140F" stroke-width="2.2" stroke-linecap="round" style="position: absolute; left: 13px; top: 14px"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
      <input type="search" aria-label="Search" value="TH26-02" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px 0 42px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; color: #14140F">
    </div>
    <div role="group" aria-label="Show" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid #14140F; border-radius: 4px; overflow: hidden">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 4px; border: 0; border-right: 1px solid #14140F; font-family: inherit; font-weight: 700; font-size: 13px; background: {{t.bg}}; color: {{t.fg}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <div style="flex: 1 1 0; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #45463E">{{count}}</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <a href="{{r.href}}" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #CFCFC4; border-radius: 6px; text-decoration: none; color: #14140F">
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px">{{r.id}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 3px; white-space: nowrap; background: {{r.bg}}; color: {{r.fg}}">{{r.tag}}</span>
        </span>
        <span style="font-weight: 600">{{r.title}}</span>
        <span style="font-size: 13px; color: #45463E">{{r.sub}}</span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid #14140F; background: #FFFFFF">
    <a href="PhoneToday.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Today</a>
    <a href="PhoneFind.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #F4F4EF; background: #14140F; text-decoration: none">Find</a>
    <a href="PhoneScan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 800; font-size: 14px; color: #14140F; background: #FF5A1F; text-decoration: none; border-left: 2px solid #14140F; border-right: 2px solid #14140F">Scan</a>
    <a href="PhoneReceive.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Receive</a>
    <a href="PhoneMore.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none; border-left: 1px solid #CFCFC4">More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'All' };
  }
  renderVals() {
    const C = { ok: ['#DDEFE8','#0B5D4B'], lab: ['#E9E3F7','#4A2D8F'], n: ['#E6E6DE','#14140F'] };
    const r = (kind, id, title, sub, tag, c, href) => ({ kind, id, title, sub, tag, bg: C[c][0], fg: C[c][1], href });
    const all = [
      r('Holes', 'TH26-02', 'Test hole on DEMO-2601', '3 units · 0.5–12.0 m', 'TEST HOLE', 'n', 'PhoneFind.dc.html'),
      r('Units', 'BKT-2026-000143', 'Bucket · DEMO-2601', 'TH26-01, TH26-02 · Bay C · Shelf 2', 'IN STORAGE', 'ok', 'PhoneUnit.dc.html'),
      r('Units', 'ST-2026-000031', 'Shelby tube · DEMO-2601', 'TH26-02 · ST1 · Lab bench 2', 'IN LAB', 'lab', 'PhoneUnit.dc.html'),
      r('Units', 'CRE-2026-000009', 'Core box · DEMO-2601', 'TH26-02 · Core racks · Row 1', 'IN STORAGE', 'ok', 'PhoneUnit.dc.html'),
      r('Programs', 'DEMO-2601', 'Foundation investigation', 'Samples from TH26-02 · 4 of 6 tests done', 'LAB PROGRAM', 'lab', 'PhoneFind.dc.html')
    ];
    const cur = this.state.tab;
    const rows = all.filter((x) => cur === 'All' || x.kind === cur);
    return {
      rows, count: rows.length + (rows.length === 1 ? ' RESULT' : ' RESULTS') + ' FOR "TH26-02"',
      tabs: ['All', 'Units', 'Holes', 'Programs'].map((label) => ({ label, on: cur === label, bg: cur === label ? '#14140F' : '#FFFFFF', fg: cur === label ? '#F4F4EF' : '#14140F', pick: () => this.setState({ tab: label }) }))
    };
  }
}
</script>
</body>
</html>
