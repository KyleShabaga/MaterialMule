<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8340A}a:hover{color:#14140F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4EF; color: #14140F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 2px solid #14140F; background: #E8E9E2">
    <a href="PhoneToday.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: #14140F">Back</a>
    <button type="button" style="min-height: 44px; padding: 0 12px; border: 2px solid #14140F; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-weight: 700; font-size: 14px; color: #14140F">Mark all read</button>
  </header>

  <div style="flex: 1 1 0; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Notifications</h1>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #45463E">3 UNREAD</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="{{r.href}}" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid #CFCFC4; border-radius: 6px; text-decoration: none; color: #14140F; background: {{r.rowBg}}">
        <span aria-hidden="true" style="width: 12px; height: 12px; margin-top: 5px; flex-shrink: 0; border: 2px solid #14140F; background: {{r.dot}}"></span>
        <span style="flex: 1 1 0; min-width: 0">
          <span style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; padding: 3px 6px; border-radius: 3px; background: {{r.bg}}; color: {{r.fg}}">{{r.tag}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #45463E">{{r.t}}</span>
          </span>
          <span style="display: block; font-weight: {{r.weight}}; margin-top: 4px">{{r.title}}</span>
          <span style="display: block; font-size: 13px; color: #45463E">{{r.sub}}</span>
        </span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid #14140F; background: #FFFFFF">
    <a href="PhoneToday.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Today</a>
    <a href="PhoneFind.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none; border-left: 1px solid #CFCFC4">Find</a>
    <a href="PhoneScan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 800; font-size: 14px; color: #14140F; background: #FF5A1F; text-decoration: none; border-left: 2px solid #14140F; border-right: 2px solid #14140F">Scan</a>
    <a href="PhoneReceive.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Receive</a>
    <a href="PhoneMore.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none; border-left: 1px solid #CFCFC4">More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { w: ['#FBEBC2','#7A4E00'], lab: ['#E9E3F7','#4A2D8F'], bad: ['#F9DFDC','#A3201A'], ok: ['#DDEFE8','#0B5D4B'] };
    const r = (unread, tag, c, t, title, sub, href) => ({ tag, t, title, sub, href, bg: C[c][0], fg: C[c][1], dot: unread ? '#FF5A1F' : '#FFFFFF', rowBg: unread ? '#FFFFFF' : '#F4F4EF', weight: unread ? '700' : '500' });
    return {
      rows: [
        r(true, 'PRINT', 'w', '08:14', '5 labels did not print', 'DEMO-2610 · printer was offline', 'PhoneToday.dc.html'),
        r(true, 'LAB', 'lab', '08:40', 'Pull 3 units for DEMO-2610', 'Bay B · requested by Jo Fixture', 'PhoneUnit.dc.html'),
        r(true, 'REVIEW', 'w', '08:40', 'Field report waiting for your review', 'DEMO-2616 · ticket 004417', 'PhoneConcrete.dc.html'),
        r(false, 'RECEIVED', 'ok', '08:02', 'Receipt confirmed, 6 IDs issued', 'DEMO-2614 · by Dana Tester', 'PhoneToday.dc.html'),
        r(false, 'OVERDUE', 'bad', '09 Nov', '2 units are past retention', 'DEMO-2613 · Bay D', 'PhoneToday.dc.html'),
        r(false, 'HOLD', 'w', '09 Nov', 'HOLD review due, 25-11 D', 'DEMO-2616 · hold until 09 Nov', 'PhoneConcrete.dc.html')
      ]
    };
  }
}
</script>
</body>
</html>
