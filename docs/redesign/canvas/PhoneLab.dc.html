<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: lab programs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8340A}a:hover{color:#14140F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4EF; color: #14140F; font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 2px solid #14140F; background: #E8E9E2">
    <a href="PhoneMore.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; color: #14140F">Back</a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">3 ACTIVE PROGRAMS</span>
  </header>

  <div style="flex: 1 1 0; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Lab programs</h1>

    <section style="background: #FFFFFF; border: 2px solid #14140F; border-radius: 6px; overflow: hidden">
      <div style="padding: 8px 14px; background: #14140F; color: #F4F4EF; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">TO PULL NOW · 3 UNITS</div>
      <sc-for list="{{pull}}" as="p" hint-placeholder-count="3">
        <a href="PhoneUnit.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 8px 14px; border-bottom: 1px solid #CFCFC4; text-decoration: none; color: #14140F">
          <span><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px">{{p.id}}</span><span style="display: block; font-size: 13px; color: #45463E">{{p.loc}}</span></span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600">{{p.project}}</span>
        </a>
      </sc-for>
      <a href="PhoneScan.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: #FF5A1F; font-weight: 800; font-size: 16px; color: #14140F; text-decoration: none">Scan to check out</a>
    </section>

    <sc-for list="{{programs}}" as="g" hint-placeholder-count="3">
      <div style="background: #FFFFFF; border: 1px solid #CFCFC4; border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
          <span><span style="display: block; font-weight: 700; font-size: 16px">{{g.name}}</span><span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #45463E">{{g.project}}</span></span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; white-space: nowrap">{{g.text}}</span>
        </div>
        <div role="img" aria-label="{{g.aria}}" style="display: flex; gap: 2px">
          <sc-for list="{{g.cells}}" as="c" hint-placeholder-count="12"><div style="flex: 1 1 0; height: 14px; border: 1px solid #14140F; background: {{c}}"></div></sc-for>
        </div>
      </div>
    </sc-for>
    <div style="margin-top: auto; font-size: 13px; color: #45463E">Black is done, orange is in progress. Tests are marked done at the lab computer.</div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 2px solid #14140F; background: #FFFFFF">
    <a href="PhoneToday.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Today</a>
    <a href="PhoneFind.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none; border-left: 1px solid #CFCFC4">Find</a>
    <a href="PhoneScan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 800; font-size: 14px; color: #14140F; background: #FF5A1F; text-decoration: none; border-left: 2px solid #14140F; border-right: 2px solid #14140F">Scan</a>
    <a href="PhoneReceive.dc.html" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #14140F; text-decoration: none">Receive</a>
    <a href="PhoneMore.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 60px; font-weight: 700; font-size: 13px; color: #F4F4EF; background: #14140F; text-decoration: none">More</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const g = (name, project, done, doing, total) => ({ name, project, text: done + ' of ' + total, aria: done + ' of ' + total + ' tests done, ' + doing + ' in progress', cells: Array.from({ length: total }, (_, i) => i < done ? '#14140F' : i < done + doing ? '#FF5A1F' : '#FFFFFF') });
    return {
      pull: [
        { id: 'BKT-2026-000119', loc: 'Bay B · Shelf 1', project: 'DEMO-2610' },
        { id: 'BKT-2026-000120', loc: 'Bay B · Shelf 1', project: 'DEMO-2610' },
        { id: 'ST-2026-000031', loc: 'Tube rack · Slot 12', project: 'DEMO-2601' }
      ],
      programs: [g('Foundation investigation', 'DEMO-2601', 5, 1, 8), g('Roadway subgrade', 'DEMO-2610', 13, 1, 18), g('Slope stability', 'DEMO-2612', 0, 3, 10)]
    };
  }
}
</script>
</body>
</html>
